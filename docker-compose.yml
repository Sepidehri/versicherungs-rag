services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 10

  # One-shot job that downloads the open-source models into the shared volume.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:3b && ollama pull llama3.2:3b"]

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      RAG_OLLAMA_BASE_URL: http://ollama:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama:
