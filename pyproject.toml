[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "versicherungs-rag"
version = "0.1.0"
description = "RAG assistant for German insurance conditions with built-in LLM comparison and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sepideh" }]
dependencies = [
    "fastembed>=0.7",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
    "numpy>=1.26",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "openai>=1.50",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vrag = "versicherungs_rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/versicherungs_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
